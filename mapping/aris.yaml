# ARIS AML type-mapping table (interlingua #10), built against the AML
# interface and community-documented ARIS type codes, no licensed real export
# seen — see interlingua's tests/fixtures/aml/README.md and the closing comment
# of interlingua #10 for what a real licensed export must be checked against
# before this table is trusted.
#
# Same shape as mapping/archimate.yaml (interlingua #5), read and validated the same
# way (`check/mapping_rules.py:check_aris_mapping`), independently: this
# table names every metamodel concept it knows about, mapped or explicitly
# `unmapped-concepts`, on its own — a concept archimate.yaml covers is
# still named here too, since the two tables are validated separately.
#
# `elements` rows key on an ARIS `TypeNum` (an ObjDef's type, e.g.
# `OT_FUNC`); `relationships` rows key on a `CxnDef.Type` (an ARIS
# connection, kept under the schema's existing section name). `doubtful: true`
# marks every row here, without exception: none of these ARIS type codes
# was checked against a licensed export this session, only against public
# ARIS community references (ariscommunity.com threads) that confirm the
# `OT_`/`CT_`/`AT_` naming convention and a few exact codes (`OT_ORG_UNIT`
# is community-confirmed as ARIS's type 43; `AT_NAME`/`AT_DESC` and
# `CT_IS_A` likewise) — the others follow the same convention but are this
# worker's best-effort reading of the documented structure, not a
# verified string. `mapping/archimate.yaml` carries no such
# caveat; this table does, on every row.
#
# ARIS's classic EPC/organisation notation has no equivalent at all for
# most of interlingua's ArchiMate-derived technology- and business-layer
# concepts (there is no ArchiMate-style layering in ARIS to begin with),
# so most of the catalogue's metamodel concepts are named under
# `unmapped-concepts:` rather than mapped — that is a real property of
# ARIS's vocabulary, not a shortfall of this table.
#
# Every type belongs to exactly one perspective (beslut 8), so this table
# names the per-perspective types and not the family concepts they
# specialise. OT_EVT is mapped to verksamhetshändelse (C-135), the one event
# type of the verksamhet perspective, which is where an EPC event belongs.
# OT_FUNC maps to verksamhetsaktivitet (C-175, beslut 22): an EPC function is
# a step in a process, not a running function (C-158), and since beslut 22 the
# step is a type of its own. EPC's rule nodes (and, or, xor) have no row: a
# branching is an activity that uses a beslutslogik with several outgoing
# utlöser relations, not an element.

elements:
  - name: OT_FUNC
    concepts: [C-175]
    doubtful: true
  - name: OT_EVT
    concepts: [C-135]
    doubtful: true
  - name: OT_ORG_UNIT
    concepts: [C-073]
    doubtful: true
  - name: OT_APPL_SYS_TYPE
    concepts: [C-071]
    doubtful: true
  - name: OT_IT_SYSTEM
    concepts: [C-072]
    doubtful: true

relationships:
  - name: CT_IS_A
    concepts: [C-063]
    doubtful: true

